name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set TAG
        run: |
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' ${{ env.main_project_module }}/build.gradle.kts)" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          echo ${{ secrets.STORE }} | base64 -d > upload.jks
          echo ${{ secrets.LOCAL }} | base64 -d > local.properties
          chmod +x ./gradlew;
          ./gradlew assembleRelease bundleRelease --stacktrace
          rm upload.jks local.properties

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk
            ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab
